  must_include:
  - 10,000|10000
  source: finance/relocation-policy.md
- id: policy_fact-10
  category: policy_fact
  question: Who do I report a lost laptop to, and how quickly?
  expect: answer
  must_include:
  - 1 hour|one hour|within an hour
  - 4357|security@
  source: it/lost-or-stolen-device.md
- id: policy_fact-11
  category: policy_fact
