name: northpeak
description: EvalGate test set for the Northpeak Robotics assistant (fictional company)
tests:
- id: policy_fact-01
  category: policy_fact
  question: How many days of paid sick leave do employees get per year?
  expect: answer
  must_include:
  - 10 days|ten days
  source: hr/sick-leave-policy.md
- id: policy_fact-02
  category: policy_fact
  question: How many days of bereavement leave can I take for an immediate family member?
  expect: answer
  must_include:
  - 5 days|five days
